services:
  - type: web
    name: telegram-webapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp_server:app --host 0.0.0.0 --port $PORT
    disk:
      name: botdata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false

  - type: worker
    name: telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: botdata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
